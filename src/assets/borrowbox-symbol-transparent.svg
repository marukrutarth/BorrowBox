<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Upper 'B' Monogram Gradient -->
    <linearGradient id="bb-b-upper" x1="148" y1="92" x2="340" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="48%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#6D28D9" />
    </linearGradient>

    <!-- Sculpted Lower 'B' Bowl Gradient -->
    <linearGradient id="bb-b-lower" x1="148" y1="204" x2="388" y2="408" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="52%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#4C1D95" />
    </linearGradient>

    <!-- Subtle Depth Fold Along Lower Bowl Arch -->
    <linearGradient id="bb-b-fold" x1="148" y1="196" x2="320" y2="250" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2E1065" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#2E1065" stop-opacity="0" />
    </linearGradient>

    <!-- Tapered Orbital Swoosh Gradient -->
    <linearGradient id="bb-orbit-grad" x1="96" y1="382" x2="418" y2="216" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="55%" stop-color="#EDE9FE" />
      <stop offset="85%" stop-color="#C4B5FD" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.9" />
    </linearGradient>

    <!-- Isometric Parcel Box Top Face -->
    <linearGradient id="bb-box-top" x1="196" y1="252" x2="326" y2="306" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F3E8FF" />
    </linearGradient>

    <!-- Isometric Parcel Box Left Face -->
    <linearGradient id="bb-box-left" x1="196" y1="280" x2="260" y2="388" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="55%" stop-color="#DDD6FE" />
      <stop offset="100%" stop-color="#A78BFA" />
    </linearGradient>

    <!-- Isometric Parcel Box Right Face -->
    <linearGradient id="bb-box-right" x1="262" y1="284" x2="328" y2="388" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F5F3FF" />
      <stop offset="60%" stop-color="#C4B5FD" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
  </defs>

  <!-- 1. Right Tapered Crescent of Orbital Swoosh (Passing Behind Right of 'B') -->
  <path
    d="M332 212C388 215 424 242 414 278C407 302 384 322 352 336C374 318 390 298 394 276C400 246 374 222 332 212Z"
    fill="url(#bb-orbit-grad)"
  />

  <!-- 2. Upper 'B' Stem & Loop with Slanted Geometric Counter -->
  <path
    fill-rule="evenodd"
    clip-rule="evenodd"
    d="M148 96H282C330 96 360 123 360 164C360 192 343 214 316 225V260H148V96ZM210 148H270C292 148 304 159 304 176C304 193 292 204 270 204H194L210 148Z"
    fill="url(#bb-b-upper)"
  />

  <!-- 3. Soft Contour Shadow Between Upper Loop & Lower Arch -->
  <path
    d="M148 242C176 208 222 194 276 194C302 194 326 200 344 212L316 228C298 216 274 210 248 210C204 210 168 226 148 258V242Z"
    fill="url(#bb-b-fold)"
  />

  <!-- 4. Sculpted Lower 'B' Bowl Embracing the Isometric Parcel Box -->
  <path
    d="M148 252C174 214 222 198 278 198C344 198 388 240 388 304C388 366 342 408 274 408H148V382H256C304 382 334 352 334 306C334 264 304 238 258 238C214 238 178 260 162 296L148 252Z"
    fill="url(#bb-b-lower)"
  />

  <!-- 5. Contoured Negative-Space Separation Plate Around Isometric Parcel Box -->
  <path
    d="M262 240L338 272V364L262 400L186 364V272L262 240Z"
    fill="#0B0F19"
    stroke="#0B0F19"
    stroke-width="10"
    stroke-linejoin="round"
  />

  <!-- 6. Isometric Parcel Box: Top Diamond Face -->
  <path
    d="M262 250L326 277L262 304L198 277L262 250Z"
    fill="url(#bb-box-top)"
  />

  <!-- 7. Isometric Parcel Box: Left Face -->
  <path
    d="M196 285L257 311V386L196 356V285Z"
    fill="url(#bb-box-left)"
  />

  <!-- 8. Isometric Parcel Box: Right Face with Shipping Tape Bookmark Cutout -->
  <path
    fill-rule="evenodd"
    clip-rule="evenodd"
    d="M267 311L328 285V356L267 386V311ZM289 302L310 293V333L299 325L289 336V302Z"
    fill="url(#bb-box-right)"
  />

  <!-- 9. Foreground Tapered Crescent of Orbital Swoosh (Sweeping Across Bottom-Left of Box) -->
  <path
    d="M168 294C116 320 96 356 114 380C132 402 184 404 248 390C194 394 148 388 134 368C122 350 136 322 168 294Z"
    fill="url(#bb-orbit-grad)"
  />

  <!-- 10. Three Radiating Parcel Spark Ticks (Top-Right of Box) -->
  <rect
    x="304"
    y="216"
    width="10"
    height="26"
    rx="5"
    transform="rotate(14 304 216)"
    fill="#FFFFFF"
  />
  <rect
    x="328"
    y="225"
    width="10"
    height="26"
    rx="5"
    transform="rotate(42 328 225)"
    fill="#FFFFFF"
  />
  <rect
    x="344"
    y="246"
    width="10"
    height="26"
    rx="5"
    transform="rotate(68 344 246)"
    fill="#FFFFFF"
  />
</svg>
